# Anchor's own architectural constraints, enforced on Anchor's own tree.
#
# This is the "dogfood" config (ticket DND-139 / T8): Anchor uses its own
# custom Credo checks to enforce the ADR-001 five-bucket architecture on its
# own source. It is wired into `.credo.exs` (which enables the corresponding
# `Anchor.Check.*` modules), so `mix credo --strict` is the gate that enforces
# these rules on this repo.
#
# Only the ARCHITECTURE checks are enabled today (see `.credo.exs` for the
# rationale on why the style checks — single_control_flow, alphabetized_functions,
# max_file_length, etc. — are staged rather than enabled). Enabling a style
# check here without the tree already conforming would redden real `lib/` code,
# and T8 is a config-and-wiring ticket that must not groom production modules.
#
# Selection note: every rule below selects its files by `paths` globs. (An
# older note here said only `paths` could fire from a real `.anchor.yml`; Gap D,
# DND-140, fixed that, and `pattern`/`uses_module` select too.) Each rule carries
# only the keys its type accepts, and a selector: an unknown key or a rule with
# no selector fails the load (DND-1286; see `Anchor.Domain.RuleSchema`).

rules:
  # --- Rule 1: Domain must stay pure (side-effect-free, framework-free) ---
  #
  # Domain code (ADR 001) may not depend on Credo internals, on IO
  # (File / YamlElixir), or on the Side Effect / Manager buckets. It receives
  # plain data and returns plain data.
  #
  # SELF-DOGFOOD (DND-143): the previous owner follow-up noted here — "the ideal
  # rule is to forbid `Credo.*` ANYWHERE, but `no_direct_dependency` matched
  # forbidden modules by EXACT atom only, so they had to be enumerated" — is now
  # closed by Gap A (`forbidden_patterns`, DND-142). The five enumerated
  # `Credo.*` modules are replaced by the single dot-bounded module-name glob
  # `*.Credo.*`, which forbids EVERY Credo module a Domain file could reference
  # (not just the five that were spelled out), tightening the self-check. `*`
  # crosses dots, and the `.` is literal, so it matches a `.Credo.` segment. The
  # pattern is matched against the fully-qualified
  # name (`Elixir.Credo.Code`, …), so it leads with `*`. Domain has zero *code*
  # references to Credo (only moduledoc/comment mentions, which are not in the
  # AST the analyzer walks), so `mix credo --strict` stays green.
  - type: no_direct_dependency
    paths:
      - "lib/anchor/domain/**/*.ex"
    recursive: true
    forbidden_patterns:
      - "*.Credo.*"
    forbidden_modules:
      - File
      - YamlElixir
      - Anchor.Adapters.ConfigFile
      - Anchor.Adapters.BaselineFile
      - Anchor.Adapters.CredoKeys
      - Anchor.Adapters.BeamReader
      - Anchor.Adapters.GitShow
      - Anchor.Adapters.GitChangeSource
      - Anchor.Adapters.GitEnv
      - Anchor.Adapters.GraphArtifact
      - Anchor.Adapters.SourceReader
      - Anchor.Managers.Graph
      - Anchor.Managers.Explain
      - Anchor.Adapters.SourcePatcher
      - Anchor.Adapters.GitStatus
      - Anchor.Adapters.TestRunner
      - Anchor.Adapters.CallTracer
      - Anchor.Adapters.SuiteRunner
      - Anchor.Adapters.ProjectModules
      - Anchor.Adapters.CoverageFile
      - Anchor.Adapters.RecordFile
      - Anchor.Sabotage.CoverageCollector
      - Anchor.Managers.Sabotage.Coverage
      - Anchor.Managers.Lint
      - Anchor.Managers.AstBaseline
      - Anchor.Managers.Sabotage
      - Anchor.Managers.Sabotage.CoverageCompare
      - Anchor.Managers.Sabotage.Replay
      - Anchor.Managers.Sabotage.Runner
      - System

  # --- Rule 2: the config parser specifically must not read files ---
  #
  # `Anchor.Config` (lib/anchor/domain/config.ex) is the pure YAML-map parser;
  # reading `.anchor.yml` off disk is the Side Effect adapter's job
  # (`Anchor.Adapters.ConfigFile`). A narrower, targeted guard on top of Rule 1.
  - type: no_direct_dependency
    paths:
      - "lib/anchor/domain/config.ex"
    recursive: false
    forbidden_modules:
      - File

  # --- Rule 3: every check shell must use the shared Framework base ---
  #
  # Each of Anchor's checks is a thin Framework delegate built on
  # `Anchor.Check.Base` (which provides `run_on_all_source_files/3` and the
  # violation->issue mapping). The check shells are enumerated explicitly rather
  # than globbed as `lib/anchor/check/*.ex` because that directory also holds
  # `base.ex` (which DEFINES the base and cannot use itself) and `source.ex`
  # (the AST-acquisition Framework edge, which is not a check shell). A bare
  # `*.ex` glob would flag both of those as false positives.
  - type: must_use_module
    paths:
      - "lib/anchor/check/alphabetized_functions.ex"
      - "lib/anchor/check/case_on_bare_arg.ex"
      - "lib/anchor/check/max_file_length.ex"
      - "lib/anchor/check/module_pattern_restrictions.ex"
      - "lib/anchor/check/must_use_module.ex"
      - "lib/anchor/check/no_comparison_in_if.ex"
      - "lib/anchor/check/no_dependency.ex"
      - "lib/anchor/check/no_discarded_pure_expression.ex"
      - "lib/anchor/check/no_discarding_arrow_in_with.ex"
      - "lib/anchor/check/no_forwarding_function.ex"
      - "lib/anchor/check/no_transitive_dependency.ex"
      - "lib/anchor/check/no_tuple_match_in_head.ex"
      - "lib/anchor/check/single_control_flow.ex"
      - "lib/anchor/check/struct_getter_convention.ex"
      - "lib/anchor/check/struct_owned_by_module.ex"
    required_modules:
      - Anchor.Check.Base

  # --- Rule: aggregate declarations (DND-5476, DND-5659) ---
  #
  # Anchor has no database, and says so on purpose: `aggregates: declare:
  # none` below. Under it the rule is not vacuous: every module of lib/ that
  # persists (an Ecto schema, an Ecto.Repo, an @anchor_aggregate, a call of a
  # Repo write, Ecto.Repo, Ecto.Multi or an Ecto adapter) fails the run.
  # Enforced, no baseline.
  - type: aggregate_declarations
    id: aggregate_declarations
    paths: ["lib/**/*.ex"]

  # --- Rule: the whole-program analyses finish over Anchor itself (DND-5715) ---
  #
  # CI's `mix anchor.graph` runs the 0-CFA and the demand analysis over every
  # module of lib/: a hit bound or a function left unsummarised fails the run.
  # This is the one whole-Anchor run of them (no test reads Anchor's own beams,
  # see CLAUDE.md), and its floors are the positive controls of the self tests
  # it replaced: hundreds of functions, hundreds of apply sites, and some
  # parameter judged unused.
  - type: analyses_complete
    id: analyses_complete
    paths: ["lib/**/*.ex"]
    min_modules: 208
    min_functions: 501
    min_apply_sites: 101
    min_absent_parameters: 1

  # --- Rule: the calls matrix over compiled code (DND-5442) ---
  #
  # `mix anchor.graph` judges every call between two of Anchor's own modules
  # against `architecture: calls` below, including calls a macro injects and
  # dynamic calls on a computed module, which the AST rules above cannot see.
  #
  # The baseline holds what it found when it landed: Lint's calls into
  # Anchor.Check (DND-1288; a dynamic call on a computed check module is
  # judged against every check exporting the function), GraphRules.by_type/1,
  # and Mutator's apply/3 with a computed function name. It only shrinks;
  # `mix anchor.graph --base origin/main` (CI, on a pull request) fails one a
  # branch adds.
  - type: layering
    id: layering
    paths: ["lib/**/*.ex"]
    baseline: .anchor/baselines/layering.txt

  # --- Rule: no cycle between contexts (DND-5445) ---
  #
  # The calls of lib/ collapsed to contexts (depth 2: Anchor.Domain,
  # Anchor.Managers, ...) must form no cycle. The baseline holds what it
  # found when it landed: one five-context cycle that runs through Lint's
  # dynamic calls on the check modules (DND-1288), and Mutator's apply/3.
  - type: context_acyclic
    id: context_acyclic
    paths: ["lib/**/*.ex"]
    baseline: .anchor/baselines/context_acyclic.txt

  # --- Rule: each function's bucket matches what it causes (DND-5447) ---
  #
  # `mix anchor.graph` infers every function's role from its effects (a
  # Domain function reaches no effect, an adapter performs one, a Manager
  # orchestrates effects through other modules; roots are Framework) and
  # judges each public function of the domain, adapters and managers buckets
  # against its bucket. The effects Anchor's adapters perform through
  # libraries outside the default primitives are declared in
  # `architecture: effects` below.
  #
  # The baseline holds what it found when it landed: Domain functions that
  # apply a function their caller passes in (an unresolved call counts as an
  # effect until DND-5500's closed-world values narrow it), GraphRules.needs/1
  # loading the rule modules through the code server (DND-5574), and adapter
  # functions that are pure (conversions, GitEnv's environment list, a
  # GenServer child_spec, DiffHunks' IO.iodata_to_binary/1).
  - type: effects_match_bucket
    id: effects_match_bucket
    paths: ["lib/**/*.ex"]
    baseline: .anchor/baselines/effects_match_bucket.txt

  # --- Rule: every parameter reaches the return value or an effect (DND-5470) ---
  - type: parameter_reaches_sink
    id: parameter_reaches_sink
    paths: ["lib/**/*.ex"]
    baseline: .anchor/baselines/parameter_reaches_sink.txt

  # The placement rules (DND-5448) are not enabled here yet, though
  # effects_match_bucket above builds their model on every run and prints its
  # precision. `function_placement` would judge nothing (`interfaces:` below makes
  # every module an interface, and rules 2 to 4 exempt those), and
  # `reachable_from_root` would fail closed (Mutator.generate/4's apply/3 computes
  # a name). A fail-closed issue is enforced under `enforcement: report` too.

  # --- Rule: only a struct's own module changes it, by value flow (DND-5454) ---
  #
  # The graph half of struct ownership: a Map writer, struct/2, put_in or a
  # map update on a value known as another module's struct through its
  # @type t fields, a @spec return, or a match in macro-injected code.
  # The baseline holds what it found when it landed: five updates of a
  # GraphReport.Finding (its `enforcement:`) and of a Sabotage.Scope
  # (`base_sha:`) outside their modules.
  - type: struct_owned_by_module_flow
    id: struct_owned_by_module_flow
    paths: ["lib/**/*.ex"]
    owned_namespaces: ["Anchor"]
    baseline: .anchor/baselines/struct_owned_by_module_flow.txt

  # --- Rule: cross-context calls land on the interface (DND-5443) ---
  #
  # A call from one context (depth 2: Anchor.Domain, Anchor.Managers, ...)
  # into another must land on that context's interface: its managers bucket
  # (`architecture: interfaces` below: here every bucket but framework), or a
  # module listed in interfaces.exports. Anchor's replacement for Boundary's
  # exports. The baseline holds what it found when it landed: Lint's calls
  # into the Anchor.Check modules (DND-1288), GraphRules.by_type/1's calls of
  # each check's rule_type/0 (also held in layering.txt), the top-level Anchor
  # module (no context at depth 2), Mutator.generate/4's dynamic call, and
  # the sabotage task starting CoverageCollector. It only shrinks.
  - type: interface
    id: interface
    paths: ["lib/**/*.ex"]
    baseline: .anchor/baselines/interface.txt

# --- Aggregates (DND-5659) ---
#
# Anchor persists nothing: it reads beams, source and YAML, and writes only
# reports and artifacts to files. The aggregate_declarations rule above
# fails any module of lib/ that persists.
aggregates:
  declare: none
  reason: "Anchor has no database: it reads beams, source and YAML and writes files"

# --- Generated sabotage (DND-5473, DND-5484) ---
#
# `mix anchor.sabotage run` on Anchor's own tree. Records follow ADR 003:
# test/sabotage_records/<domain>-YYYYMMDD-<slot>.md, the domain derived from
# the mutated module's name (Anchor.Domain.Sabotage.Mutator -> sabotage,
# Anchor.Check.NoDependency -> no_dependency, Anchor.Config -> config).
sabotage:
  records:
    dir: "test/sabotage_records"
    naming: domain_date_slot
    domain_from: module
    domain_strip_prefixes:
      - "Anchor.Domain.Checks."
      - "Anchor.Domain."
      - "Anchor.Check."
      - "Anchor.Managers."
      - "Anchor.Adapters."
      - "Anchor."
    adr: "ADR 003"

# The ADR-001 five buckets over Anchor's compiled code, judged by
# `mix anchor.graph` (DND-5440) in Anchor's own CI (run in the dev env, so the
# graph is lib/ as it ships: test/support is compiled only under MIX_ENV=test).
# Every module of lib/ lands in exactly one bucket. Each floor is the bucket's
# module count when the runner landed: a moved directory that empties a
# bucket fails the run instead of passing it. Lowering a floor is the owner's
# call. The layering rule above judges `calls` (DND-5442).
architecture:
  contexts:
    depth: 2
  buckets:
    - name: framework
      role: framework
      select:
        - paths: ["lib/anchor/check/**/*.ex", "lib/mix/tasks/**/*.ex"]
        - pattern: "Anchor"
        - pattern: "Anchor.Aggregate"
      min_modules: 20
    - name: adapters
      role: adapters
      select:
        - paths: ["lib/anchor/adapters/**/*.ex", "lib/anchor/sabotage/**/*.ex"]
      min_modules: 10
    - name: domain
      role: domain
      select:
        - paths: ["lib/anchor/domain/**/*.ex"]
      min_modules: 59
    - name: managers
      role: managers
      select:
        - paths: ["lib/anchor/managers/**/*.ex"]
      min_modules: 4
  calls:
    framework: [framework, managers, domain]
    adapters: [adapters, domain]
    domain: [domain]
    managers: [managers, adapters, domain]
  # DND-5443: Anchor's depth-2 contexts are its buckets (Anchor.Domain,
  # Anchor.Managers, Anchor.Adapters, ...), not business contexts, so a
  # bucket's modules are its context's interface: a call between two of them
  # is judged by the calls matrix (layering). The interface rule then catches a
  # call into Framework from another context (Lint into the Anchor.Check
  # modules, DND-1288) and a module with no context. The framework bucket is
  # left out on purpose.
  interfaces:
    buckets: [managers, domain, adapters]
  # The effects Anchor's adapters perform through calls outside the default
  # effect primitives (DND-5447): call tracing, a glob over the file system,
  # running a Mix task (the in-process test suite), and loading a module
  # through the code server (BehaviourReader).
  effects:
    - ":erlang.trace"
    - ":erlang.trace_pattern"
    - ":erlang.trace_info"
    - ":erlang.trace_delivered"
    - "Path.wildcard"
    - "Mix.Task.run"
    - "Code.ensure_loaded?"
