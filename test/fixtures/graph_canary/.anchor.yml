# The graph runner's canary tree (DND-5440). Every graph rule ticket adds a
# compliant and a violating module per rule, and its rule here. The
# integration test compiles lib/ in the test and runs the Manager over it.
rules:
  - type: layering
    id: layering
    paths: ["lib/canary/**/*.ex"]
  - type: context_acyclic
    id: context_acyclic
    paths: ["lib/canary/**/*.ex"]

architecture:
  contexts:
    depth: 2
  buckets:
    - name: domain
      role: domain
      select:
        - paths: ["lib/canary/domain/**/*.ex"]
      min_modules: 2
    - name: managers
      role: managers
      select:
        - paths: ["lib/canary/managers/**/*.ex"]
    - name: adapters
      role: adapters
      select:
        - paths: ["lib/canary/adapters/**/*.ex"]
    - name: framework
      role: framework
      select:
        - paths: ["lib/canary/framework/**/*.ex"]
  calls:
    domain: [domain]
    managers: [managers, adapters, domain]
    adapters: [adapters, domain]
    framework: [framework, managers, domain]
  interfaces:
    buckets: [managers]
