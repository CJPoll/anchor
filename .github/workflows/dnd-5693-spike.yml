name: DND-5693 spike

# Throwaway (DND-5693): the causal-attribution measurements. The branch is never
# merged. A push runs the jobs its head commit's subject names ([spike:fixture],
# [spike:cost], [spike:suite]); no other job runs, so the gated head starts none.
on:
  push:
    branches:
      - dnd-5693-causal-spike
  workflow_dispatch:

permissions:
  contents: read

jobs:
  fixture:
    name: Fixture Q1 Q2 Q3 Q6
    if: contains(github.event.head_commit.message, '[spike:fixture]')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Elixir
        uses: erlef/setup-beam@54075bcc5e249e4758d363f27d099f55d843f124 # v1.24.1
        with:
          elixir-version: "1.19.4"
          otp-version: "28.2"

      - name: Fixture probe
        run: elixir logs/dnd-5693/fixture_probe.exs 2>&1 | tee fixture.log; test "${PIPESTATUS[0]}" = 0
        shell: bash

  cost:
    name: Cost Q4
    if: contains(github.event.head_commit.message, '[spike:cost]')
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      MIX_ENV: test
      CI: "true"
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Elixir
        id: beam
        uses: erlef/setup-beam@54075bcc5e249e4758d363f27d099f55d843f124 # v1.24.1
        with:
          elixir-version: "1.19.4"
          otp-version: "28.2"

      - name: Restore deps and _build cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            deps
            _build
          key: ${{ runner.os }}-mix-${{ steps.beam.outputs.elixir-version }}-${{ steps.beam.outputs.otp-version }}-${{ hashFiles('mix.lock') }}
          restore-keys: |
            ${{ runner.os }}-mix-${{ steps.beam.outputs.elixir-version }}-${{ steps.beam.outputs.otp-version }}-

      - name: Install dependencies
        run: mix deps.get

      - name: Compile
        run: mix compile

      - name: Cost, three rounds of each variant, one VM each
        shell: bash
        run: |
          for round in 1 2 3; do
            for variant in untraced call_count every label_body:1 label_body:64 pid_word:1 pid_word:64 word:64; do
              mix run logs/dnd-5693/cost.exs "$variant" 2>&1 | grep -E "^COST|rror" || echo "COST variant=$variant no line"
            done
          done

  suite:
    name: Suite Q4 Q5 Q6
    if: contains(github.event.head_commit.message, '[spike:suite]')
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      MIX_ENV: test
      CI: "true"
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Elixir
        id: beam
        uses: erlef/setup-beam@54075bcc5e249e4758d363f27d099f55d843f124 # v1.24.1
        with:
          elixir-version: "1.19.4"
          otp-version: "28.2"

      - name: Restore deps and _build cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            deps
            _build
          key: ${{ runner.os }}-mix-${{ steps.beam.outputs.elixir-version }}-${{ steps.beam.outputs.otp-version }}-${{ hashFiles('mix.lock') }}
          restore-keys: |
            ${{ runner.os }}-mix-${{ steps.beam.outputs.elixir-version }}-${{ steps.beam.outputs.otp-version }}-

      - name: Install dependencies
        run: mix deps.get

      - name: Compile
        run: mix compile

      - name: Every-call, seed 0, preloaded, twice (Q5)
        shell: bash
        run: |
          for n in 1 2; do
            mix run logs/dnd-5693/suite_map.exs every ec$n.etf preload 0 > ec$n.out 2>&1 || echo "EXIT ec$n $?"
            grep -E "^SUITE|^  [0-9]+\) test|tests, [0-9]+ failure" ec$n.out | cut -c1-400
          done

      - name: K=64, label read in the body, twice
        shell: bash
        run: |
          for n in 1 2; do
            mix run logs/dnd-5693/suite_map.exs label_body:64 kk$n.etf preload 0 > kk$n.out 2>&1 || echo "EXIT kk$n $?"
            grep -E "^SUITE|^  [0-9]+\) test|tests, [0-9]+ failure" kk$n.out | cut -c1-400
          done

      - name: K=1, label read in the body, once
        shell: bash
        run: |
          timeout 900 mix run logs/dnd-5693/suite_map.exs label_body:1 k1.etf preload 0 > k1.out 2>&1 || echo "EXIT k1 $?"
          grep -E "^SUITE|^  [0-9]+\) test|tests, [0-9]+ failure" k1.out | cut -c1-400

      - name: Compare
        shell: bash
        run: |
          elixir logs/dnd-5693/compare.exs shares ec1.etf
          elixir logs/dnd-5693/compare.exs diff ec1.etf ec2.etf
          elixir logs/dnd-5693/compare.exs diff kk1.etf kk2.etf
          elixir logs/dnd-5693/compare.exs diff ec1.etf kk1.etf
          if [ -f k1.etf ]; then elixir logs/dnd-5693/compare.exs diff ec1.etf k1.etf; fi

      - name: Upload the logs and maps
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: dnd-5693-suite
          path: |
            *.out
            *.etf
          retention-days: 14
