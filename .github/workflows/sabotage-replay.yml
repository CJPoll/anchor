name: Sabotage replay

# DND-5485: replays every landed sabotage record's kills on main. Each
# `killed` or `timeout` row of an `anchor-kills` block is re-applied to the
# current tree and its killers run by name; a row whose killers all pass
# (LOST POWER) fails the job, naming the record and each test. A row that
# can no longer be replayed as recorded is reported as drifted, never a
# failure on its own. Zero rows, or every row drifted, is COULD NOT MEASURE
# (exit 3), never green. Weekly, and on demand; never on a pull request.

on:
  schedule:
    - cron: "17 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sabotage-replay
  cancel-in-progress: false

jobs:
  replay:
    name: Sabotage replay
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Elixir
        id: beam
        uses: erlef/setup-beam@54075bcc5e249e4758d363f27d099f55d843f124 # v1.24.1
        with:
          elixir-version: "1.19.4"
          otp-version: "28.2"

      - name: Restore deps and _build cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            deps
            _build
          key: ${{ runner.os }}-mix-${{ steps.beam.outputs.elixir-version }}-${{ steps.beam.outputs.otp-version }}-${{ hashFiles('mix.lock') }}
          restore-keys: |
            ${{ runner.os }}-mix-${{ steps.beam.outputs.elixir-version }}-${{ steps.beam.outputs.otp-version }}-

      - name: Install dependencies
        run: mix deps.get

      # The replay runs `mix test` (MIX_ENV=test) once per row; compile the
      # test build first so the first row does not pay for it alone.
      - name: Compile (test)
        env:
          MIX_ENV: test
        run: mix compile --warnings-as-errors

      # A fresh checkout is clean, so every row's file is committed code.
      - name: Replay (mix anchor.sabotage replay --max all)
        run: mix anchor.sabotage replay --max all
