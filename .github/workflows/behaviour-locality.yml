name: Behaviour locality

# DND-5489: joins the coverage map to the sabotage records and prints each test's
# confirmed causes and the directories they spread over, in report mode. It needs
# the map, which only the Coverage map workflow builds, so it runs when that
# workflow succeeds on main, and by hand with a run id. A map or a record it cannot
# use fails the job (exit 3), never green. It reads the artifact as a safe term and
# checks every field (`CoverageMap.check/1`), and this file runs from main.

on:
  workflow_run:
    workflows:
      - Coverage map
    branches:
      - main
    types:
      - completed
  workflow_dispatch:
    inputs:
      run_id:
        description: The Coverage map run whose artifact to read
        required: true

permissions:
  contents: read
  actions: read

concurrency:
  group: behaviour-locality
  cancel-in-progress: true

jobs:
  behaviours:
    name: Behaviour locality
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Elixir
        id: beam
        uses: erlef/setup-beam@54075bcc5e249e4758d363f27d099f55d843f124 # v1.24.1
        with:
          elixir-version: "1.19.4"
          otp-version: "28.2"

      - name: Restore deps and _build cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            deps
            _build
          key: ${{ runner.os }}-mix-${{ steps.beam.outputs.elixir-version }}-${{ steps.beam.outputs.otp-version }}-${{ hashFiles('mix.lock') }}
          restore-keys: |
            ${{ runner.os }}-mix-${{ steps.beam.outputs.elixir-version }}-${{ steps.beam.outputs.otp-version }}-

      - name: Install dependencies
        run: mix deps.get

      - name: Download the coverage map
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: anchor-coverage
          run-id: ${{ github.event.workflow_run.id || inputs.run_id }}
          github-token: ${{ github.token }}

      - name: Behaviours (mix anchor.sabotage behaviours)
        run: mix anchor.sabotage behaviours --coverage anchor-coverage.etf
