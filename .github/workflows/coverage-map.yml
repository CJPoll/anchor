name: Coverage map

# DND-5474: builds the per-test coverage map (test -> project functions it
# executed) that `mix anchor.sabotage run --coverage PATH` selects tests from.
# The whole suite runs one test at a time with call tracing, so it runs here,
# never on a desktop: on push to main, weekly, and by hand. A new job; no
# step of ci.yml changes.

on:
  push:
    branches:
      - main
  schedule:
    - cron: "17 4 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: coverage-map-${{ github.ref }}
  cancel-in-progress: true

jobs:
  coverage-map:
    name: Coverage map
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      MIX_ENV: test
      CI: "true"
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Elixir
        id: beam
        uses: erlef/setup-beam@54075bcc5e249e4758d363f27d099f55d843f124 # v1.24.1
        with:
          elixir-version: "1.19.4"
          otp-version: "28.2"

      - name: Restore deps and _build cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            deps
            _build
          key: ${{ runner.os }}-mix-${{ steps.beam.outputs.elixir-version }}-${{ steps.beam.outputs.otp-version }}-${{ hashFiles('mix.lock') }}
          restore-keys: |
            ${{ runner.os }}-mix-${{ steps.beam.outputs.elixir-version }}-${{ steps.beam.outputs.otp-version }}-

      - name: Install dependencies
        run: mix deps.get

      - name: Compile (warnings as errors)
        run: mix compile --warnings-as-errors

      # The call-tracer adapter test turns VM-wide tracing on itself, so it is
      # excluded from the run that is already traced (it runs in ci.yml).
      - name: Build the coverage map
        run: mix anchor.sabotage coverage --out anchor-coverage.etf -- --exclude global_tracing

      - name: Check the map
        run: |
          mix run --no-start -e '
            alias Anchor.Domain.Sabotage.CoverageMap
            {:ok, map} = "anchor-coverage.etf" |> File.read!() |> :erlang.binary_to_term([:safe]) |> CoverageMap.check()
            :ok = CoverageMap.validate(map)
            files = map |> CoverageMap.tests_for("Anchor.Domain.GlobPattern.matches_pattern?/2") |> Enum.map(& &1.file)
            IO.puts("tests: #{length(map.tests)}, modules_traced: #{map.modules_traced}, outside_windows: #{map.outside_windows}, late_events: #{map.late_events}")
            unless "test/anchor/domain/glob_pattern_test.exs" in files do
              IO.puts(:stderr, "GlobPattern.matches_pattern?/2 lists no test from test/anchor/domain/glob_pattern_test.exs")
              System.halt(1)
            end
          '

      - name: Upload the map
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: anchor-coverage
          path: anchor-coverage.etf
          retention-days: 30
          if-no-files-found: error
