name: DND-5652 equality

# Temporary (DND-5652).
on:
  pull_request:

permissions:
  contents: read

jobs:
  equality:
    name: Equality
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      MIX_ENV: test
      CI: "true"
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Elixir
        id: beam
        uses: erlef/setup-beam@54075bcc5e249e4758d363f27d099f55d843f124 # v1.24.1
        with:
          elixir-version: "1.19.4"
          otp-version: "28.2"

      - name: Restore deps and _build cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            deps
            _build
          key: ${{ runner.os }}-mix-${{ steps.beam.outputs.elixir-version }}-${{ steps.beam.outputs.otp-version }}-${{ hashFiles('mix.lock') }}
          restore-keys: |
            ${{ runner.os }}-mix-${{ steps.beam.outputs.elixir-version }}-${{ steps.beam.outputs.otp-version }}-

      - name: Install dependencies
        run: mix deps.get

      - name: Compile (warnings as errors)
        run: mix compile --warnings-as-errors

      - name: Build the maps with a fixed seed (first-hit x2, every-call x2)
        run: |
          for round in 1 2; do
            mix anchor.sabotage coverage --out fh$round.etf -- --exclude global_tracing --exclude dnd5652_skip --seed 0 2>&1 | grep -E "Finished in|first-hit gate|anchor.sabotage coverage: tests"
            DND5652_EVERY_CALL=1 mix anchor.sabotage coverage --out ec$round.etf -- --exclude global_tracing --exclude dnd5652_skip --seed 0 2>&1 | grep -E "Finished in|anchor.sabotage coverage: tests"
          done
          echo "=== first-hit 1 against every-call 1"; mix run --no-start profile/dnd5652_compare.exs fh1.etf ec1.etf
          echo "=== first-hit 2 against every-call 2"; mix run --no-start profile/dnd5652_compare.exs fh2.etf ec2.etf
          echo "=== every-call 1 against every-call 2 (baseline: the tracer against itself)"; mix run --no-start profile/dnd5652_compare.exs ec1.etf ec2.etf
          echo "=== first-hit 1 against first-hit 2"; mix run --no-start profile/dnd5652_compare.exs fh1.etf fh2.etf
