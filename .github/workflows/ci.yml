name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    env:
      MIX_ENV: test
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Elixir
        id: beam
        uses: erlef/setup-beam@54075bcc5e249e4758d363f27d099f55d843f124 # v1.24.1
        with:
          elixir-version: "1.19.4"
          otp-version: "28.2"

      - name: Restore deps and _build cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            deps
            _build
          key: ${{ runner.os }}-mix-${{ steps.beam.outputs.elixir-version }}-${{ steps.beam.outputs.otp-version }}-${{ hashFiles('mix.lock') }}
          restore-keys: |
            ${{ runner.os }}-mix-${{ steps.beam.outputs.elixir-version }}-${{ steps.beam.outputs.otp-version }}-

      - name: Install dependencies
        run: mix deps.get

      - name: Compile (warnings as errors)
        run: mix compile --warnings-as-errors

      - name: Check formatting
        run: mix format --check-formatted

      - name: Credo (strict)
        run: mix credo --strict

      # Dogfood (DND-5440): the graph engine judges Anchor's own compiled lib/
      # against .anchor.yml's architecture: section. Run in the dev env so the
      # graph is lib/ as it ships (test/support compiles only under test).
      # On a pull request it also reads each baseline at the base branch
      # (DND-5441, --base): a line the branch adds to a baseline fails as
      # GREW, so a baseline only shrinks. The checkout is shallow, so the base
      # branch is fetched first; its name goes through env, never the script.
      - name: Fetch the base branch (pull request)
        if: github.event_name == 'pull_request'
        env:
          BASE_REF: ${{ github.base_ref }}
        run: git fetch --no-tags --depth=1 origin "+refs/heads/${BASE_REF}:refs/remotes/origin/${BASE_REF}"

      - name: Graph (mix anchor.graph --base, pull request)
        if: github.event_name == 'pull_request'
        env:
          MIX_ENV: dev
          BASE_REF: ${{ github.base_ref }}
        run: mix anchor.graph --base "origin/${BASE_REF}"

      # DND-5632: an ast rule's baseline only shrinks too. mix credo judges its
      # held, NEW and STALE entries; this fails an entry the branch added.
      - name: AST baselines (mix anchor.baseline --base, pull request)
        if: github.event_name == 'pull_request'
        env:
          MIX_ENV: dev
          BASE_REF: ${{ github.base_ref }}
        run: mix anchor.baseline --base "origin/${BASE_REF}"

      - name: Graph (mix anchor.graph)
        if: github.event_name != 'pull_request'
        env:
          MIX_ENV: dev
        run: mix anchor.graph

      - name: Test
        run: mix test
